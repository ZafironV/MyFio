<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollo y los lirios</title>
<link rel="icon" type="image/png" href="Assets/LirioCyan.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Love+Light&display=swap');
</style>
<style>
  :root{
    --caption-bg:rgba(255,255,255,0.92);
    --caption-fg:#2b2b2b;
    --caption-border:#ffffff;
    --toggle-bg:rgba(255,255,255,0.85);
    --toggle-fg:#2b2b2b;
    --countdown-fg:#2b2b2b;
    --countdown-shadow:0 2px 8px rgba(255,255,255,0.55);
    --love-fg:#1a1a1a;
    --love-shadow:0 4px 14px rgba(0,0,0,0.5);
  }
  html[data-theme="dark"]{
    --caption-bg:rgba(20,20,35,0.88);
    --caption-fg:#f1f1f5;
    --caption-border:#3a3a55;
    --toggle-bg:rgba(20,20,35,0.85);
    --toggle-fg:#f1f1f5;
    --countdown-fg:#ffffff;
    --countdown-shadow:0 2px 8px rgba(0,0,0,0.45);
    --love-fg:#ffffff;
    --love-shadow:0 4px 14px rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}

  html, body{
    margin:0;
    font-family:"Segoe UI", Roboto, Arial, sans-serif;
    overflow:hidden;
    cursor:url('Assets/Cursor_32.png') 4 2, auto;
    user-select:none;
    -webkit-user-select:none;
    -ms-user-select:none;
  }

  #scene img{
    -webkit-user-drag:none;
    user-drag:none;
  }

  #scene{
    position:relative;
    width:100vw;
    height:100vh;
    background:#8ec9ff;
    overflow:hidden;
  }

  /* Fondos de modo claro (sol) y modo oscuro (luna), con crossfade */
  .bgLayer{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center bottom;
    background-repeat:no-repeat;
    transition:opacity 0.6s ease;
  }
  #bgSun{
    background-image:url('Assets/BG_SUN.jpeg');
    opacity:1;
  }
  #bgMoon{
    background-image:url('Assets/BG_MOON.jpeg');
    opacity:0;
  }
  html[data-theme="dark"] #bgSun{ opacity:0; }
  html[data-theme="dark"] #bgMoon{ opacity:1; }

  /* Macizo de lirios */
  #patch{
    position:absolute;
    bottom:4%;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    height:auto;
    pointer-events:auto;
    image-rendering:pixelated;
    transform-origin:bottom center;
  }
  #patch.bush-shake{
    animation:bushShakePatch 0.6s ease-in-out;
  }
  @keyframes bushShakePatch{
    0%, 100%{ transform:translateX(-50%) rotate(0deg); }
    15%{ transform:translateX(-50%) rotate(-5deg); }
    30%{ transform:translateX(-50%) rotate(4deg); }
    45%{ transform:translateX(-50%) rotate(-3deg); }
    60%{ transform:translateX(-50%) rotate(2deg); }
    80%{ transform:translateX(-50%) rotate(-1deg); }
  }

  /* Lirio cian objetivo, sobre el macizo, que el pollo recoge */
  #groundCyanLily{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(70px);
    width:64px;
    height:auto;
    pointer-events:auto;
    image-rendering:pixelated;
    transform-origin:bottom center;
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  #groundCyanLily.picked{
    opacity:0.15;
    transform:translateX(70px) scale(0.8) rotate(-8deg);
  }
  #groundCyanLily.bush-shake{
    animation:bushShakeGround 0.6s ease-in-out;
  }
  @keyframes bushShakeGround{
    0%, 100%{ transform:translateX(70px) rotate(0deg); }
    15%{ transform:translateX(70px) rotate(-8deg); }
    30%{ transform:translateX(70px) rotate(6deg); }
    45%{ transform:translateX(70px) rotate(-5deg); }
    60%{ transform:translateX(70px) rotate(3deg); }
    80%{ transform:translateX(70px) rotate(-1deg); }
  }

  /* Pollo */
  #chickenWrap{
    position:absolute;
    width:110px;
    height:109px;
    bottom:9%;
    left:0;
    will-change:transform;
    pointer-events:auto;
  }

  /* Gotitas de nervio al hacer click sobre el pollo */
  .sweatDrop{
    position:absolute;
    font-size:14px;
    line-height:1;
    pointer-events:none;
    animation:dropFall 0.7s ease-in forwards;
    z-index:5;
  }
  @keyframes dropFall{
    0%{ transform:translateY(0) scale(1); opacity:1; }
    100%{ transform:translateY(28px) scale(0.6); opacity:0; }
  }
  #chickenImg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:pixelated;
    display:block;
    transform:scaleX(-1); /* el gif mira a la izquierda; lo volteamos para que mire a la derecha */
  }

  /* Lirio superpuesto cerca del pico, cuando el pollo "recoge" el lirio cian */
  #beakLily{
    position:absolute;
    top:40px;
    left:89px;
    width:17px;
    height:auto;
    opacity:0;
    transition:opacity 0.35s ease;
    pointer-events:none;
    image-rendering:pixelated;
  }
  #chickenWrap.has-lily #beakLily{
    opacity:1;
  }

  /* Cápsula de texto */
  #caption{
    position:absolute;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--caption-bg);
    color:var(--caption-fg);
    border:2px solid var(--caption-border);
    border-radius:999px;
    padding:10px 22px;
    font-size:15px;
    font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
    transition:background 0.4s ease, color 0.4s ease, border 0.4s ease;
    white-space:nowrap;
    max-width:80vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Modo oscuro/claro */
  #themeToggle{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;
    background:var(--toggle-bg);
    color:var(--toggle-fg);
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
    transition:background 0.4s ease, color 0.4s ease;
  }
  #themeToggle:hover{ filter:brightness(1.05); }

  /* Botón secreto: solo aparece si se escribe "pollo" con el teclado */
  #skipToLoveBtn{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    background:var(--toggle-bg);
    color:var(--toggle-fg);
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
    transition:background 0.4s ease, color 0.4s ease, opacity 0.3s ease;
    opacity:0;
    pointer-events:none;
    visibility:hidden;
  }
  #skipToLoveBtn.revealed{
    opacity:1;
    pointer-events:auto;
    visibility:visible;
  }
  #skipToLoveBtn:hover{ filter:brightness(1.05); }

  /* Reloj en cuenta regresiva, centrado en la pantalla */
  #countdown{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  #countdown .label{
    color:var(--countdown-fg);
    font-family:'Love Light', cursive;
    font-size:56px;
    text-shadow:var(--countdown-shadow);
    transition:color 0.4s ease;
  }
  #countdown .digits{
    display:flex;
    align-items:center;
    gap:4px;
  }
  #countdown .digit-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:48px;
    height:64px;
    background:#000000;
    color:#ffffff;
    font-family:"Courier New", Courier, monospace;
    font-weight:700;
    font-size:40px;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
  }
  #countdown .colon{
    color:var(--countdown-fg);
    font-family:"Courier New", Courier, monospace;
    font-weight:700;
    font-size:40px;
    text-shadow:var(--countdown-shadow);
    margin:0 1px;
    transition:color 0.4s ease;
  }

  /* Utilidad para desvanecer elementos de la escena de paseo al terminar el timer */
  .fade-out{
    opacity:0 !important;
    transition:opacity 0.6s ease;
    pointer-events:none !important;
  }

  /* Escena final: corazón de lirios esparcido en el suelo, con el pollo encima */
  #loveScene{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
    z-index:9;
  }
  #loveScene.visible{
    opacity:1;
    pointer-events:auto;
  }
  #heartContainer{
    position:absolute;
    bottom:3%;
    left:50%;
    transform:translateX(-50%);
    width:420px;
    height:210px;
    transform-origin:bottom center;
  }
  .heartLily{
    position:absolute;
    height:auto;
    image-rendering:pixelated;
    pointer-events:none;
    transform:translate(-50%, -50%);
  }
  #chickenWrap.in-heart{
    left:50%;
    top:34%;
    bottom:auto;
    right:auto;
    transform:translate(-50%, -50%) !important;
  }
  #loveText{
    position:absolute;
    top:30%;
    left:50%;
    transform:translate(-50%, -50%);
    color:var(--love-fg);
    font-family:'Love Light', cursive;
    font-size:clamp(38px, 6.5vw, 78px);
    text-align:center;
    max-width:95vw;
    text-shadow:var(--love-shadow);
    padding:0 16px;
    line-height:1.2;
  }
</style>
</head>
<body>

<div id="scene">
  <button id="themeToggle" type="button">🌙 Modo oscuro</button>
  <button id="skipToLoveBtn" type="button">💗 Ver el final</button>

  <div id="countdown">
    <div class="label">Pollo trabajando...</div>
    <div class="digits" id="countdownDigits">
      <span class="digit-box" id="cd-h1">0</span><span class="digit-box" id="cd-h2">0</span>
      <span class="colon">:</span>
      <span class="digit-box" id="cd-m1">0</span><span class="digit-box" id="cd-m2">0</span>
      <span class="colon">:</span>
      <span class="digit-box" id="cd-s1">0</span><span class="digit-box" id="cd-s2">0</span>
    </div>
  </div>

  <div id="caption">El pollito empieza a caminar...</div>

  <div class="bgLayer" id="bgSun"></div>
  <div class="bgLayer" id="bgMoon"></div>

  <img id="patch" src="Assets/Lirios.png" alt="macizo de lirios" draggable="false">
  <img id="groundCyanLily" src="Assets/LirioCyan.png" alt="lirio cian" draggable="false">

  <div id="chickenWrap">
    <img id="chickenImg" src="Assets/PolloWalk_transparent.gif" alt="pollo caminando" draggable="false">
    <img id="beakLily" src="Assets/LirioCyan.png" alt="lirio cian recogido" draggable="false">
  </div>

  <div id="loveScene">
    <div id="heartContainer"></div>
    <div id="loveText">Feliz dia amor mio, te amo muchisimo mi Fio</div>
  </div>
</div>

<script>
(function(){

  var targetLily = document.getElementById('groundCyanLily');
  var sceneEnded = false;

  /* ---------- Escena final: corazón de lirios ---------- */
  var loveSceneEl = document.getElementById('loveScene');
  var heartContainerEl = document.getElementById('heartContainer');

  function buildHeart(container){
    container.innerHTML = '';
    var w = container.clientWidth;
    var h = container.clientHeight;
    var PX_PER_UNIT = 10.5;
    var SQUASH_Y = 0.8; /* aplana el corazón para que se vea esparcido en el suelo */
    var cx = w / 2;
    var cy = h - 15 - 17 * SQUASH_Y * PX_PER_UNIT;
    var rings = [
      { scale: 1.0, count: 52, size: 24 },
      { scale: 0.76, count: 36, size: 21 },
      { scale: 0.5, count: 22, size: 18 },
      { scale: 0.26, count: 10, size: 16 }
    ];
    rings.forEach(function(ring){
      for (var i = 0; i < ring.count; i++){
        var t = (i / ring.count) * Math.PI * 2;
        var ux = 16 * Math.pow(Math.sin(t), 3);
        var uy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        var px = cx + ux * ring.scale * PX_PER_UNIT;
        var py = cy - uy * ring.scale * SQUASH_Y * PX_PER_UNIT;
        var img = document.createElement('img');
        img.src = 'Assets/LirioCyan.png';
        img.className = 'heartLily';
        img.draggable = false;
        img.style.width = ring.size + 'px';
        img.style.left = px + 'px';
        img.style.top = py + 'px';
        container.appendChild(img);
      }
    });
  }

  function triggerLoveScene(){
    if (sceneEnded) return;
    sceneEnded = true;

    patchEl.classList.add('fade-out');
    targetLily.classList.add('fade-out');
    captionEl.classList.add('fade-out');
    document.getElementById('countdown').classList.add('fade-out');

    setPose('relax');
    chickenWrap.style.transform = '';
    chickenWrap.classList.add('has-lily');
    chickenWrap.classList.add('in-heart');

    buildHeart(heartContainerEl);
    heartContainerEl.appendChild(chickenWrap);

    loveSceneEl.classList.add('visible');
    skipToLoveBtn.classList.remove('revealed');
  }

  /* ---------- Botón secreto: se revela al escribir "pollo" con el teclado ---------- */
  var skipToLoveBtn = document.getElementById('skipToLoveBtn');
  var secretBuffer = '';

  window.addEventListener('keydown', function(e){
    if (e.key && e.key.length === 1){
      secretBuffer = (secretBuffer + e.key.toLowerCase()).slice(-5);
      if (secretBuffer === 'pollo'){
        skipToLoveBtn.classList.add('revealed');
      }
    }
  });

  skipToLoveBtn.addEventListener('click', function(){
    triggerLoveScene();
  });

  /* ---------- Reloj en cuenta regresiva hasta las 11:59 pm ---------- */
  var cdDigits = {
    h1: document.getElementById('cd-h1'),
    h2: document.getElementById('cd-h2'),
    m1: document.getElementById('cd-m1'),
    m2: document.getElementById('cd-m2'),
    s1: document.getElementById('cd-s1'),
    s2: document.getElementById('cd-s2')
  };

  function pad2(n){
    return n < 10 ? '0' + n : '' + n;
  }

  function updateCountdown(){
    if (sceneEnded) return;
    var now = new Date();
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 0, 0);
    if (now.getTime() >= target.getTime()){
      triggerLoveScene();
      return;
    }
    var totalSeconds = Math.max(0, Math.floor((target.getTime() - now.getTime()) / 1000));
    var hh = pad2(Math.floor(totalSeconds / 3600));
    var mm = pad2(Math.floor((totalSeconds % 3600) / 60));
    var ss = pad2(totalSeconds % 60);

    cdDigits.h1.textContent = hh[0];
    cdDigits.h2.textContent = hh[1];
    cdDigits.m1.textContent = mm[0];
    cdDigits.m2.textContent = mm[1];
    cdDigits.s1.textContent = ss[0];
    cdDigits.s2.textContent = ss[1];
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* ---------- Toggle modo oscuro/claro ---------- */
  var themeToggle = document.getElementById('themeToggle');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = prefersDark ? 'dark' : 'light';
  applyTheme(theme);

  themeToggle.addEventListener('click', function(){
    theme = (theme === 'dark') ? 'light' : 'dark';
    applyTheme(theme);
  });

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = (t === 'dark') ? '☀️ Modo claro' : '🌙 Modo oscuro';
  }

  /* ---------- Animación del pollo ---------- */
  var chickenWrap = document.getElementById('chickenWrap');
  var chickenImg = document.getElementById('chickenImg');
  var captionEl = document.getElementById('caption');
  var sceneEl = document.getElementById('scene');

  var CHICKEN_W = 110;
  var SPEED = 70; // px/segundo
  var PECK_DURATION = 1900; // ms
  var BOOST_MULTIPLIER = 2.6;
  var BOOST_DURATION = 2500; // ms, se reinicia con cada click

  var POSE_SRC = {
    walk: 'Assets/PolloWalk_transparent.gif',
    stand: 'Assets/PolloStand_transparent.gif',
    relax: 'Assets/Pollo_Relax_transparent.gif'
  };

  function setPose(pose){
    var src = POSE_SRC[pose];
    if (chickenImg.getAttribute('src') !== src){
      chickenImg.setAttribute('src', src);
    }
  }

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var state = {
    phase: 'walkIn',
    x: -CHICKEN_W,
    peckX: 0,
    endX: 0,
    peckStart: 0,
    boostUntil: 0
  };

  function isBoosted(now){
    return now < state.boostUntil;
  }

  function spawnSweatDrop(){
    var drop = document.createElement('div');
    drop.className = 'sweatDrop';
    drop.textContent = '💦';
    var offsetX = Math.round(Math.random() * 16 - 8);
    drop.style.left = (60 + offsetX) + 'px';
    drop.style.top = '2px';
    chickenWrap.appendChild(drop);
    drop.addEventListener('animationend', function(){
      drop.remove();
    });
  }

  function triggerShake(el){
    el.classList.remove('bush-shake');
    void el.offsetWidth; /* fuerza reflow para poder reiniciar la animación */
    el.classList.add('bush-shake');
  }

  chickenWrap.addEventListener('click', function(){
    state.boostUntil = performance.now() + BOOST_DURATION;
    spawnSweatDrop();
  });

  var patchEl = document.getElementById('patch');
  patchEl.addEventListener('click', function(){
    triggerShake(patchEl);
  });
  targetLily.addEventListener('click', function(){
    triggerShake(targetLily);
  });

  function computeGeometry(){
    var sceneRect = sceneEl.getBoundingClientRect();
    var targetRect = targetLily.getBoundingClientRect();
    var targetCenter = (targetRect.left - sceneRect.left) + targetRect.width / 2;
    state.peckX = targetCenter - CHICKEN_W / 2;
    state.endX = sceneRect.width + CHICKEN_W;
  }

  function setCaption(text){
    captionEl.textContent = text;
  }

  function positionChicken(x){
    chickenWrap.style.transform = 'translate3d(' + Math.round(x) + 'px, 0, 0)';
  }

  function resetScene(){
    state.phase = 'walkIn';
    state.x = -CHICKEN_W;
    state.boostUntil = 0;
    targetLily.classList.remove('picked');
    chickenWrap.classList.remove('has-lily');
    setPose('walk');
    setCaption('El pollito empieza a caminar...');
    positionChicken(state.x);
  }

  window.addEventListener('resize', computeGeometry);
  computeGeometry();
  positionChicken(state.x);
  setPose('walk');

  if (reducedMotion){
    /* Escena estática representativa cuando se prefiere poco movimiento */
    computeGeometry();
    state.x = state.peckX;
    positionChicken(state.x);
    chickenWrap.classList.add('has-lily');
    targetLily.classList.add('picked');
    setPose('stand');
    setCaption('El pollito picoteó el lirio cian.');
    return;
  }

  var lastTime = null;

  function tick(now){
    if (sceneEnded) return;
    if (lastTime === null) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;

    var boosted = isBoosted(now);
    var effectiveSpeed = boosted ? SPEED * BOOST_MULTIPLIER : SPEED;
    var effectivePeckDuration = boosted ? PECK_DURATION / BOOST_MULTIPLIER : PECK_DURATION;

    if (state.phase === 'walkIn'){
      state.x += effectiveSpeed * dt;
      if (state.x >= state.peckX){
        state.x = state.peckX;
        state.phase = 'peck';
        state.peckStart = now;
        chickenWrap.classList.add('has-lily');
        targetLily.classList.add('picked');
        setPose('stand');
        setCaption('¡El pollito picoteó un lirio cian!');
      }
    } else if (state.phase === 'peck'){
      if (now - state.peckStart >= effectivePeckDuration){
        state.phase = 'walkOut';
        setPose('walk');
        setCaption('Satisfecho, sigue su camino...');
      }
    } else if (state.phase === 'walkOut'){
      state.x += effectiveSpeed * dt;
      if (state.x >= state.endX){
        state.phase = 'reset';
      }
    } else if (state.phase === 'reset'){
      resetScene();
    }

    positionChicken(state.x);
    requestAnimationFrame(tick);
  }

  setCaption('El pollito empieza a caminar...');
  requestAnimationFrame(tick);

})();
</script>

</body>
</html>
